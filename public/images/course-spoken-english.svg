<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" rx="16" fill="#EEF5FD"/>
  <circle cx="340" cy="50" r="60" fill="#FFC928" fill-opacity="0.2"/>
  <circle cx="70" cy="190" r="50" fill="#0757A6" fill-opacity="0.12"/>
  
  <!-- Dialogue Graphic -->
  <g transform="translate(60, 45)">
    <!-- Main Speech Bubble -->
    <rect x="0" y="0" width="180" height="95" rx="18" fill="#0B2F63"/>
    <polygon points="50,95 65,115 80,95" fill="#0B2F63"/>
    <!-- Sound Waves inside bubble -->
    <circle cx="45" cy="48" r="16" fill="#0757A6"/>
    <path d="M40 40 L40 56 M45 35 L45 61 M50 42 L50 54" stroke="#FFC928" stroke-width="2.5" stroke-linecap="round"/>
    <text x="75" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">Fluency First</text>
    <text x="75" y="62" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#FFC928">Daily Speaking</text>

    <!-- Reply Speech Bubble -->
    <rect x="140" y="55" width="150" height="80" rx="16" fill="#FFFFFF" stroke="#0757A6" stroke-width="2"/>
    <polygon points="170,135 185,150 195,135" fill="#FFFFFF"/>
    <text x="160" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#0B2F63">No Grammar Fear</text>
    <text x="160" y="110" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#20B45B">Natural English</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" fill="none">
  <defs>
    <linearGradient id="trainerBg" x1="0" y1="0" x2="500" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B2F63"/>
      <stop offset="100%" stop-color="#071D3D"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20" y="-20" width="540" height="600" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0757A6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="500" height="560" rx="28" fill="url(#trainerBg)"/>
  <circle cx="420" cy="80" r="80" fill="#FFC928" fill-opacity="0.12"/>
  <circle cx="80" cy="480" r="100" fill="#0757A6" fill-opacity="0.2"/>

  <!-- Geometric accent circle -->
  <circle cx="250" cy="240" r="160" stroke="#FFC928" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Character / Portrait of Coach Kamal -->
  <!-- Suit Body -->
  <path d="M120 560 L140 370 Q250 330 360 370 L380 560 Z" fill="url(#suitGrad)"/>
  <!-- White Dress Shirt -->
  <polygon points="250,340 220,440 280,440" fill="#FFFFFF"/>
  <!-- Blue Tie with Gold Pin -->
  <polygon points="250,360 260,370 255,470 250,485 245,470 240,370" fill="#0757A6"/>
  <circle cx="250" cy="405" r="3.5" fill="#FFC928"/>
  <!-- Blazer Lapels -->
  <polygon points="190,370 225,480 210,480 170,410" fill="#334155"/>
  <polygon points="310,370 275,480 290,480 330,410" fill="#334155"/>

  <!-- Neck & Face -->
  <rect x="230" y="275" width="40" height="70" rx="8" fill="#E6A875"/>
  <ellipse cx="250" cy="225" rx="55" ry="68" fill="#EFA97A"/>

  <!-- Professional Hair Cut & Trimmed Beard -->
  <!-- Hair -->
  <path d="M192 210 C190 150 230 135 250 135 C275 135 308 148 308 200 C302 188 290 180 250 180 C215 180 200 195 192 210 Z" fill="#1C1917"/>
  <!-- Trimmed Smart Beard -->
  <path d="M205 240 C205 285 225 305 250 305 C275 305 295 285 295 240 C285 255 270 260 250 260 C230 260 215 255 205 240 Z" fill="#292524" opacity="0.85"/>

  <!-- Glasses -->
  <rect x="210" y="205" width="34" height="22" rx="6" stroke="#FFC928" stroke-width="2.5" fill="none"/>
  <rect x="256" y="205" width="34" height="22" rx="6" stroke="#FFC928" stroke-width="2.5" fill="none"/>
  <line x1="244" y1="216" x2="256" y2="216" stroke="#FFC928" stroke-width="2.5"/>

  <!-- Eyes & Eyebrows -->
  <path d="M213 198 Q227 194 240 198" stroke="#1C1917" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M260 198 Q273 194 287 198" stroke="#1C1917" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="227" cy="216" r="3.5" fill="#1C1917"/>
  <circle cx="273" cy="216" r="3.5" fill="#1C1917"/>

  <!-- Confident Warm Smile -->
  <path d="M236 250 Q250 262 264 250" stroke="#7C2D12" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Director Label Overlay -->
  <g transform="translate(40, 470)">
    <rect width="420" height="66" rx="16" fill="rgba(11, 47, 99, 0.9)" stroke="#FFC928" stroke-width="1.5" backdrop-filter="blur(8px)"/>
    <text x="24" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFC928">COACH KAMAL</text>
    <text x="24" y="48" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#EEF5FD">Director &amp; Chief Master Trainer • 12+ Yrs Experience</text>
  </g>
</svg>
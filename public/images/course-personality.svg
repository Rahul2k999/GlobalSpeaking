<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" rx="16" fill="#F0FDF4"/>
  <circle cx="330" cy="60" r="55" fill="#20B45B" fill-opacity="0.15"/>
  <circle cx="80" cy="180" r="50" fill="#FFC928" fill-opacity="0.25"/>

  <!-- Stage & Speaker Character -->
  <g transform="translate(100, 35)">
    <!-- Stage Backdrop -->
    <rect x="20" y="20" width="160" height="130" rx="16" fill="#0B2F63"/>
    <circle cx="100" cy="65" r="24" fill="#FFC928"/>
    <path d="M72 135 C72 105 85 95 100 95 C115 95 128 105 128 135 Z" fill="#FFFFFF"/>
    <!-- Stage Lights -->
    <polygon points="20,20 60,70 40,70" fill="#FFC928" opacity="0.3"/>
    <polygon points="180,20 140,70 160,70" fill="#FFC928" opacity="0.3"/>
    
    <!-- Trophy Badge -->
    <rect x="150" y="70" width="80" height="75" rx="12" fill="#FFFFFF" stroke="#20B45B" stroke-width="2"/>
    <text x="172" y="105" font-size="26">🏆</text>
    <text x="160" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#0B2F63">Stage Fear 0%</text>
  </g>
</svg>